<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WiFi Isolir</title>

    <style>
        /* Pemanggilan Font Inter ExtraBold Khusus Title */
        @font-face {
            font-family: 'InterExtraBold';
            src: url('Inter_18pt-ExtraBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Pemanggilan Font Inter SemiBold untuk Teks Lainnya */
        @font-face {
            font-family: 'InterLocal';
            src: url('Inter_18pt-SemiBold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'InterLocal', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #001f54, #003a9a, #0d1c3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            padding: 15px;
        }

        /* Container Card Utama */
        .card {
            background: #ffffff;
            border: 4px solid #ffcc00;
            border-radius: 12px;
            padding: 22px 18px;
            width: fit-content;
            max-width: 360px;
            margin-top: 2vh;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Title Menggunakan Font Inter ExtraBold */
        .title {
            color: #da251d;
            font-family: 'InterExtraBold', Arial, sans-serif;
            font-size: 24px;
            margin-bottom: 8px;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .logo-isolir {
            width: 65px;
            height: 65px;
            margin-bottom: 10px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .message-text {
            color: #111;
            font-size: 18px;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .highlight-blue {
            color: #004a9f;
        }

        /* Container List Rekening Bank */
        .bank-container {
            width: 100%;
            margin-bottom: 8px;
        }

        /* Kartu Bank dengan Slot Logo di Kiri */
        .bank-info {
            background: #f4f6f9;
            border: 1px dashed #004a9f;
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 8px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bank-logo {
            width: 38px;
            height: 38px;
            object-fit: contain;
            flex-shrink: 0;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 2px;
        }

        .bank-details {
            flex-grow: 1;
            min-width: 0;
        }

        /* Nama Bank: Biru */
        .bank-name {
            font-size: 11px;
            color: #004a9f;
            letter-spacing: 0.3px;
        }

        .bank-num {
            font-size: 14px;
            color: #111;
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .num-text {
            white-space: nowrap;
        }

        /* Tombol Copy dengan Ikon SVG Mini */
        .btn-copy {
            background: #004a9f;
            color: #fff;
            border: none;
            padding: 5px 9px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .btn-copy:active {
            background: #002d62;
        }

        .icon-copy {
            width: 12px;
            height: 12px;
            stroke: #ffffff;
        }

        /* Styling Gambar Kontak & Skylink */
        .img-kontak {
            width: 150px;
            max-width: 100%;
            height: auto;
            margin-top: 8px;
            margin-bottom: 6px;
            display: inline-block;
        }

        .img-skylink {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin-top: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">WIFI NONAKTIF !!!</h1>
        
        <!-- Logo Isolir SVG -->
        <svg class="logo-isolir" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 38 A38 38 0 0 1 78 38" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <path d="M32 50 A25 25 0 0 1 68 50" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <path d="M42 62 A12 12 0 0 1 58 62" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="50" cy="74" r="5" fill="#003a9a"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="#da251d" stroke-width="9"/>
            <line x1="20" y1="20" x2="80" y2="80" stroke="#da251d" stroke-width="9"/>
        </svg>

        <div class="message-text">
            Mohon lakukan <span class="highlight-blue">Pembayaran</span><br>
            agar internet kembali normal.
        </div>

        <!-- LIST REKENING PEMBAYARAN LANGSUNG -->
        <div class="bank-container">
            <!-- BCA -->
            <div class="bank-info">
                <img src="logo-bca.png" alt="BCA" class="bank-logo">
                <div class="bank-details">
                    <div class="bank-name">BANK BCA</div>
                    <div class="bank-num">
                        <span id="bcaAcc" class="num-text">141 046 8570</span>
                        <button class="btn-copy" onclick="copyText('bcaAcc')">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>
            </div>
			
            <!-- BNI -->
            <div class="bank-info">
                <img src="logo-bni.png" alt="BNI" class="bank-logo">
                <div class="bank-details">
                    <div class="bank-name">BANK BNI</div>
                    <div class="bank-num">
                        <span id="bniAcc" class="num-text">193 064 5047</span>
                        <button class="btn-copy" onclick="copyText('bniAcc')">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>
            </div>
			
            <!-- BRI -->
            <div class="bank-info">
                <img src="logo-bri.png" alt="BRI" class="bank-logo">
                <div class="bank-details">
                    <div class="bank-name">BANK BRI</div>
                    <div class="bank-num">
                        <span id="briAcc" class="num-text">6421 0101 8930 532</span>
                        <button class="btn-copy" onclick="copyText('briAcc')">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>
            </div>

            <!-- DANA -->
            <div class="bank-info">
                <img src="logo-dana.png" alt="DANA" class="bank-logo">
                <div class="bank-details">
                    <div class="bank-name">DANA</div>
                    <div class="bank-num">
                        <span id="danaAcc" class="num-text">081 995 164 999</span>
                        <button class="btn-copy" onclick="copyText('danaAcc')">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>
            </div>

            <!-- GOPAY -->
            <div class="bank-info">
                <img src="logo-gopay.png" alt="GOPAY" class="bank-logo">
                <div class="bank-details">
                    <div class="bank-name">GOPAY</div>
                    <div class="bank-num">
                        <span id="gopayAcc" class="num-text">081 995 164 999</span>
                        <button class="btn-copy" onclick="copyText('gopayAcc')">
                            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- GAMBAR KONTAK WA -->
        <div>
            <img src="kontak.png" alt="Kontak Admin" class="img-kontak">
        </div>

        <!-- GAMBAR SKYLINK NETWORK -->
        <div>
            <img src="skylink.png" alt="Skylink Network" class="img-skylink">
        </div>
    </div>

    <script>
        function copyText(elementId) {
            var text = document.getElementById(elementId).innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
