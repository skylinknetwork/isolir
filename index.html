<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WiFi Nonaktif - Skylink Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #001f54, #003a9a, #0d1c3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Card Utama */
        .card {
            background: #ffffff;
            border: 5px solid #ffcc00;
            border-radius: 18px;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .title {
            color: #da251d;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .logo-isolir {
            width: 75px;
            height: 75px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .message-text {
            color: #111;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .highlight-blue {
            color: #004a9f;
        }

        /* Tombol Aksi */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-wa {
            background-color: #25d366;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-pay {
            background-color: #ff6000;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 96, 0, 0.3);
        }

        .btn-check {
            background-color: #f0f0f0;
            color: #333333;
            border: 1px solid #ccc;
        }

        /* Modal Pop-up Pembayaran */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
        }

        .modal-title {
            color: #003a9a;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .bank-info {
            background: #f4f6f9;
            border: 1px dashed #004a9f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }

        .bank-name {
            font-size: 12px;
            color: #666;
        }

        .bank-num {
            font-size: 18px;
            color: #111;
            font-weight: bold;
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-copy {
            background: #004a9f;
            color: #fff;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-close {
            margin-top: 10px;
            background: #da251d;
            color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* Footer Logo Skylink */
        .footer-logo {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .skylink-svg {
            width: 180px;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">WIFI NONAKTIF !!!</h1>
        
        <!-- Logo Isolir SVG -->
        <svg class="logo-isolir" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 38 A38 38 0 0 1 78 38" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <path d="M32 50 A25 25 0 0 1 68 50" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <path d="M42 62 A12 12 0 0 1 58 62" fill="none" stroke="#003a9a" stroke-width="8" stroke-linecap="round"/>
            <circle cx="50" cy="74" r="5" fill="#003a9a"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="#da251d" stroke-width="9"/>
            <line x1="20" y1="20" x2="80" y2="80" stroke="#da251d" stroke-width="9"/>
        </svg>

        <div class="message-text">
            Mohon lakukan <span class="highlight-blue">Pembayaran</span><br>
            agar internet kembali normal.
        </div>

        <!-- Group Tombol Interaktif -->
        <div class="btn-group">
            <!-- Tombol 1: Cara Pembayaran -->
            <button class="btn btn-pay" onclick="openModal()">
                Nomor Rekening Pembayaran
            </button>

            <!-- Tombol 2: Chat WA Otomatis -->
            <a class="btn btn-wa" id="waLink" href="https://wa.me/628385839818?text=Halo%20Admin%20Skylink%20Network,%20saya%20mau%20konfirmasi%20pembayaran%20WiFi" target="_blank">
                Konfirmasi WhatsApp Admin
            </a>

            <!-- Tombol 3: Cek Ulang Koneksi -->
            <button class="btn btn-check" onclick="checkConnection()">
                🔄 Cek Ulang Koneksi Saya
            </button>
        </div>

        <!-- Footer Skylink Network -->
        
    </div>

    <!-- POP-UP MODAL PEMBAYARAN -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <h2 class="modal-title">Info Rekening Pembayaran</h2>
            
            <div class="bank-info">
                <div class="bank-name">BANK BCA</div>
                <div class="bank-num">
                    <span id="bcaAcc">141 046 8570</span>
                    <button class="btn-copy" onclick="copyText('bcaAcc')">Salin</button>
                </div>
                <div class="bank-name">Adi Prasetyo Nugroho</div>
            </div>
			
			<div class="bank-info">
                <div class="bank-name">BANK BNI</div>
                <div class="bank-num">
                    <span id="bcaAcc">141 046 8570</span>
                    <button class="btn-copy" onclick="copyText('bcaAcc')">Salin</button>
                </div>
                <div class="bank-name">Adi Prasetyo Nugroho</div>
            </div>

            <div class="bank-info">
                <div class="bank-name">DANA & GOPAY</div>
                <div class="bank-num">
                    <span id="eWalletAcc">081 995 164 999</span>
                    <button class="btn-copy" onclick="copyText('eWalletAcc')">Salin</button>
                </div>
                <div class="bank-name">Adi Prasetyo Nugroho</div>
            </div>

            <button class="btn-close" onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        // Buka Pop-up
        function openModal() {
            document.getElementById('payModal').style.display = 'flex';
        }

        // Tutup Pop-up
        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        // Salin Rekening
        function copyText(elementId) {
            var text = document.getElementById(elementId).innerText.replace(/\s+/g, '');
            navigator.clipboard.writeText(text);
            alert('Nomor rekening/HP berhasil disalin!');
        }

        // Cek Ulang Koneksi
        function checkConnection() {
            alert('Memeriksa status jaringan... Jika Anda sudah membayar, silakan tunggu 1-3 menit atau restart router WiFi Anda.');
            window.location.reload();
        }
    </script>
</body>
</html>
