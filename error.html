<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport dikunci agar tidak bisa di-zoom in/out -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WiFi Nonaktif</title>

    <style>
        body {
            /* Warna background biru gelap */
            background-color: #003a9a; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            /* Posisi card agak ke atas */
            align-items: flex-start; 
            min-height: 100vh;
            /* Menggunakan Font Arial bawaan sistem */
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        
        .container {
            margin-top: 12vh; 
            background-color: #ffffff;
            border: 4px solid #ffcc00; /* Border kuning/emas */
            border-radius: 12px;
            padding: 25px 25px; /* Jarak pas antara teks & garis kuning */
            width: fit-content; /* KUNCI: Kotak otomatis pas mengikuti panjang teks */
            max-width: 90%; /* Batas aman supaya tidak melebihi layar HP */
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .title {
            color: #da251d; /* Warna merah */
            font-size: 32px; 
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            line-height: 120%; /* Spacing 120% */
            white-space: nowrap; /* Menjaga judul tetap rapi 1 baris */
        }
		
		/* Ukuran logo SVG */
        .logo-isolir {
            width: 90px;
            height: 90px;
            margin-bottom: 15px;
            display: inline-block;
			
		}

        .message-text {
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            line-height: 120%; /* Spacing 120% */
            margin-bottom: 15px;
        }

        .highlight-blue {
            color: #004a9f; /* Teks 'Pembayaran' warna biru */
        }

        .contact-text {
            color: #000000;
            font-size: 24px;
            font-weight: bold;
            line-height: 120%; /* Spacing 120% */
            margin-bottom: 15px;
        }

        .phone-number {
            color: #17823b; /* Warna hijau */
            font-size: 26px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 0.5px;
            line-height: 120%; /* Spacing 120% */
            white-space: nowrap;
        }
    </style>
</head>
